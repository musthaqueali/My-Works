<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 50 420 360" width="512" height="512" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Heart ring gradient: deep blue (L) -> lilac (top) -> magenta/pink (R) -> blue (bottom) -->
    <linearGradient id="heartRing" x1="70" y1="70" x2="470" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#1f4b8f"/>
      <stop offset=".28" stop-color="#3f6fbf"/>
      <stop offset=".52" stop-color="#8f7fd0"/>
      <stop offset=".72" stop-color="#c85fae"/>
      <stop offset="1"   stop-color="#d95f93"/>
    </linearGradient>
    <linearGradient id="heartRingBottom" x1="150" y1="300" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0"  stop-color="#274f95"/>
      <stop offset=".5" stop-color="#3a63a8"/>
      <stop offset="1"  stop-color="#8a4f9e"/>
    </linearGradient>
    <!-- inner bevel shade of the ring -->
    <linearGradient id="ringInner" x1="90" y1="80" x2="450" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".12"/>
    </linearGradient>

    <!-- steel gradients -->
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fbfcfe"/>
      <stop offset=".18" stop-color="#d7dde6"/>
      <stop offset=".5"  stop-color="#aeb7c4"/>
      <stop offset=".82" stop-color="#cfd6df"/>
      <stop offset="1"   stop-color="#8f99a8"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f4f7fb"/>
      <stop offset=".2"  stop-color="#c8d0db"/>
      <stop offset=".5"  stop-color="#9ea8b7"/>
      <stop offset=".8"  stop-color="#c8d0db"/>
      <stop offset="1"   stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="copperBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e7b79a"/>
      <stop offset=".22" stop-color="#f3d8c4"/>
      <stop offset=".5"  stop-color="#c98f6d"/>
      <stop offset=".78" stop-color="#e7b79a"/>
      <stop offset="1"   stop-color="#a86a4c"/>
    </linearGradient>
    <linearGradient id="valveBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#a9b3c1"/>
    </linearGradient>
    <radialGradient id="cap" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#9aa4b3"/>
    </radialGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#98a2b1"/>
    </linearGradient>

    <!-- soft inner shadow for the heart cavity -->
    <radialGradient id="cavity" cx=".5" cy=".42" r=".62">
      <stop offset="0"  stop-color="#eef1f6"/>
      <stop offset=".7" stop-color="#dfe4ec"/>
      <stop offset="1"  stop-color="#c7cdd8"/>
    </radialGradient>

    <!-- heart silhouette path reused as clip + shapes -->
    <path id="heartPath" d="M280 372
      C280 372 150 300 118 232
      C96 186 96 150 112 120
      C128 90 158 74 190 74
      C224 74 254 92 280 126
      C306 92 336 74 370 74
      C402 74 432 90 448 120
      C464 150 464 186 442 232
      C410 300 280 372 280 372 Z"/>

    <clipPath id="heartClip"><use href="#heartPath"/></clipPath>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3a4a6a" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#2a3550" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ============ HEART ============ -->
  <g filter="url(#softShadow)">
    <!-- outer ring -->
    <use href="#heartPath" fill="url(#heartRing)"/>
  </g>

  <!-- cavity (inner heart fill) -->
  <g>
    <path d="M280 348
      C280 348 166 286 138 226
      C119 186 119 156 132 130
      C145 106 170 93 197 93
      C227 93 252 110 280 143
      C308 110 333 93 363 93
      C390 93 415 106 428 130
      C441 156 441 186 422 226
      C394 286 280 348 280 348 Z"
      fill="url(#cavity)"/>
  </g>

  <!-- ring inner bevel highlight (drawn as stroke between outer and inner heart) -->
  <use href="#heartPath" fill="none" stroke="url(#ringInner)" stroke-width="6" opacity=".9"/>

  <!-- everything inside is clipped to the heart cavity -->
  <g clip-path="url(#heartClip)">

    <!-- ===== GEARS (behind pipes, upper flanks) ===== -->
    <g opacity=".95" filter="url(#tinyShadow)">
      <!-- left gear -->
      <g transform="translate(196 158)">
        <g fill="url(#gearGrad)" stroke="#7a8494" stroke-width="2.5" stroke-linejoin="round">
          <path d="M0-52 8-49 10-40 20-38 26-45 34-40 31-31 39-25 48-28 51-19 43-14 43-4
                   51 3 48 12 39 11 33 19 37 27 29 33 22 27 12 30 10 40 1 41 -3 32 -13 32
                   -20 39 -28 34 -26 25 -33 18 -42 21 -46 12 -39 5 -40 -5 -48 -12 -45 -21 -36 -21
                   -30 -29 -34 -38 -26 -44 -18 -38 -9 -41 -6 -50 Z"/>
        </g>
        <circle r="15" fill="#c7cdd8" stroke="#8a94a4" stroke-width="2.5"/>
        <circle r="6.5" fill="#9aa4b3"/>
      </g>
      <!-- right gear -->
      <g transform="translate(364 158)">
        <g fill="url(#gearGrad)" stroke="#7a8494" stroke-width="2.5" stroke-linejoin="round">
          <path d="M0-52 8-49 10-40 20-38 26-45 34-40 31-31 39-25 48-28 51-19 43-14 43-4
                   51 3 48 12 39 11 33 19 37 27 29 33 22 27 12 30 10 40 1 41 -3 32 -13 32
                   -20 39 -28 34 -26 25 -33 18 -42 21 -46 12 -39 5 -40 -5 -48 -12 -45 -21 -36 -21
                   -30 -29 -34 -38 -26 -44 -18 -38 -9 -41 -6 -50 Z"/>
        </g>
        <circle r="15" fill="#c7cdd8" stroke="#8a94a4" stroke-width="2.5"/>
        <circle r="6.5" fill="#9aa4b3"/>
      </g>
    </g>

    <!-- ===== PIPE / VALVE ASSEMBLY ===== -->
    <g stroke="#5f5148" stroke-width="3" stroke-linejoin="round" filter="url(#tinyShadow)">

      <!-- horizontal copper pipes -->
      <rect x="150" y="150" width="70" height="26" rx="6" fill="url(#copperBody)"/>
      <rect x="340" y="150" width="70" height="26" rx="6" fill="url(#copperBody)"/>
      <!-- vertical drops on the outer ends -->
      <rect x="150" y="150" width="24" height="104" rx="7" fill="url(#copperBody)"/>
      <rect x="386" y="150" width="24" height="104" rx="7" fill="url(#copperBody)"/>
      <!-- flanges on outer vertical ends -->
      <rect x="144" y="188" width="36" height="12" rx="3" fill="url(#steelH)"/>
      <rect x="380" y="188" width="36" height="12" rx="3" fill="url(#steelH)"/>
      <rect x="146" y="248" width="32" height="12" rx="3" fill="url(#steelH)"/>
      <rect x="382" y="248" width="32" height="12" rx="3" fill="url(#steelH)"/>

      <!-- central vertical body (copper) -->
      <rect x="256" y="144" width="48" height="126" rx="8" fill="url(#copperBody)"/>
      <!-- steel collars on central body -->
      <rect x="250" y="152" width="60" height="15" rx="4" fill="url(#steelH)"/>
      <rect x="250" y="238" width="60" height="16" rx="4" fill="url(#steelH)"/>

      <!-- rounded valve bonnet cap -->
      <path d="M252 140 L252 112 Q252 92 280 92 Q308 92 308 112 L308 140 Z"
            fill="url(#cap)"/>
      <rect x="248" y="136" width="64" height="10" rx="4" fill="url(#steelH)"/>
      <ellipse cx="272" cy="108" rx="9" ry="6" fill="#eef2f7" opacity=".55"/>
      <!-- little sight bolt on body -->
      <circle cx="292" cy="148" r="5" fill="#7a5a44" stroke="#4a3527" stroke-width="1.5"/>

      <!-- valve box (gate valve) with X -->
      <rect x="250" y="188" width="60" height="66" rx="6" fill="url(#valveBox)"/>
    </g>

    <!-- X gate-valve symbol -->
    <g stroke="#5f5148" stroke-width="6" stroke-linecap="round">
      <line x1="262" y1="200" x2="298" y2="242"/>
      <line x1="298" y1="200" x2="262" y2="242"/>
    </g>

    <!-- subtle top-left sheen across the whole cavity -->
    <path d="M132 130 C160 100 210 92 260 120 L200 250 130 210 Z" fill="#ffffff" opacity=".10"/>
  </g>
</svg>